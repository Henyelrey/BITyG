name: tyg-architecture

services:
  # Contenedor 1: El corazon transaccional de TyG
  mysql-tyg-oltp:
    image: mysql:8.4
    container_name: tyg-oltp-container
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bd_transaccional
      TZ: America/Lima
    ports:
      - "23306:3306"
    volumes:
      - ./mysql-oltp/init:/docker-entrypoint-initdb.d
      - tyg_oltp_data:/var/lib/mysql
      - ./mysql-config/my.cnf:/etc/mysql/conf.d/my.cnf  # CDC
    networks:
      - tyg-network

  # Contenedor 2: El Data Mart para BI
  mysql-tyg-bi:
    image: mysql:8.4
    container_name: tyg-bi-container
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: tyg_datamart
      TZ: America/Lima
    ports:
      - "33306:3306"
    volumes:
      - ./mysql-bi/init:/docker-entrypoint-initdb.d
      - tyg_bi_data:/var/lib/mysql
    networks:
      - tyg-network

volumes:
  tyg_oltp_data:
  tyg_bi_data:

networks:
  tyg-network:
    driver: bridge
